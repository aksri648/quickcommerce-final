services:
  # ============================================================================
  # 1. EXPRESS MODULAR MONOLITH API BACKEND
  # ============================================================================
  - type: web
    name: quickcommerce-api
    runtime: node
    plan: standard
    region: singapore
    buildCommand: bun install && bun run --cwd packages/shared build && bun run --cwd packages/ui build && bun run --cwd apps/api db:generate && bun run --cwd apps/api build
    startCommand: bun run --cwd apps/api start
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: quickcommerce-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: quickcommerce-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: OTP_SECRET_SALT
        generateValue: true
      - key: OTP_EXPIRY_MINUTES
        value: 60
      - key: CORS_ORIGIN
        value: "*"
      - key: TZ
        value: Asia/Kolkata

  # ============================================================================
  # 2. BACKGROUND QUEUE & OUTBOX WORKER
  # ============================================================================
  - type: worker
    name: quickcommerce-worker
    runtime: node
    plan: standard
    region: singapore
    buildCommand: bun install && bun run --cwd packages/shared build && bun run --cwd apps/api db:generate && bun run --cwd apps/api build
    startCommand: bun run --cwd apps/api start:worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: quickcommerce-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: quickcommerce-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: OTP_SECRET_SALT
        generateValue: true
      - key: OTP_EXPIRY_MINUTES
        value: 60
      - key: TZ
        value: Asia/Kolkata

  # ============================================================================
  # 3. CUSTOMER PWA (Static Site)
  # ============================================================================
  - type: web
    name: quickcommerce-customer-pwa
    runtime: static
    buildCommand: bun install && bun run --cwd packages/shared build && bun run --cwd packages/ui build && bun run --cwd apps/customer-pwa build
    staticPublishPath: apps/customer-pwa/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: /api

  # ============================================================================
  # 4. DRIVER PARTNER PWA (Static Site)
  # ============================================================================
  - type: web
    name: quickcommerce-driver-pwa
    runtime: static
    buildCommand: bun install && bun run --cwd packages/shared build && bun run --cwd packages/ui build && bun run --cwd apps/driver-pwa build
    staticPublishPath: apps/driver-pwa/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: /api

  # ============================================================================
  # 5. STORE OPERATIONS PWA (Static Site)
  # ============================================================================
  - type: web
    name: quickcommerce-store-admin-pwa
    runtime: static
    buildCommand: bun install && bun run --cwd packages/shared build && bun run --cwd packages/ui build && bun run --cwd apps/store-admin-pwa build
    staticPublishPath: apps/store-admin-pwa/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: /api

  # ============================================================================
  # 6. GLOBAL GOD ADMIN PWA (Static Site)
  # ============================================================================
  - type: web
    name: quickcommerce-god-admin-pwa
    runtime: static
    buildCommand: bun install && bun run --cwd packages/shared build && bun run --cwd packages/ui build && bun run --cwd apps/god-admin-pwa build
    staticPublishPath: apps/god-admin-pwa/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: /api

# ============================================================================
# DATABASES & INFRASTRUCTURE
# ============================================================================
databases:
  - name: quickcommerce-postgres
    plan: standard
    region: singapore
    databaseName: quickcommerce
    user: qc_admin
    postgresMajorVersion: 16

redis:
  - name: quickcommerce-redis
    plan: standard
    region: singapore
    maxmemoryPolicy: noeviction
